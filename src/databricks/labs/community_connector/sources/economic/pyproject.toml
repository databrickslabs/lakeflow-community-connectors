[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-economic"
version = "0.1.0"
description = "Visma e-conomic connector for Lakeflow Community Connectors"
requires-python = ">=3.10"
dependencies = [
    # HTTP client used by economic.py for the REST API.
    "requests>=2.31.0,<3.0",
    # Provides the ``interface`` and ``libs`` modules. pyspark and pydantic
    # come with it / the Databricks runtime, so they are not declared here.
    "lakeflow-community-connectors>=0.1.0,<1.0",
]

[project.optional-dependencies]
dev = [
    # PySpark is provided by the Databricks runtime; dev-only for local tests.
    "pyspark>=4.2.0.dev0",
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<7.0",
]

[tool.setuptools]
packages = ["databricks.labs.community_connector.sources.economic"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.economic" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
