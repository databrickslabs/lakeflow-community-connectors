[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-rootly"
version = "0.1.0"
description = "Read-only Rootly connector for Lakeflow Community Connectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0,<3.0",
    "lakeflow-community-connectors>=0.1.0,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0,<9.0"]

[tool.setuptools]
packages = ["databricks.labs.community_connector.sources.rootly"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.rootly" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
