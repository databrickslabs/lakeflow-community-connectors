[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-mongodb"
version = "0.1.0"
description = "MongoDB connector for Lakeflow Community Connectors"
requires-python = ">=3.10"
dependencies = [
    # pymongo[aws] pulls pymongo-auth-aws for MONGODB-AWS. boto3 comes with the
    # Databricks runtime.
    "pymongo[aws]>=4.9,<5",
    "requests>=2.28.0,<3.0",
    "lakeflow-community-connectors>=0.1.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pyspark>=4.2.0.dev0",
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<7.0",
]

[tool.setuptools]
packages = ["databricks.labs.community_connector.sources.mongodb"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.mongodb" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
