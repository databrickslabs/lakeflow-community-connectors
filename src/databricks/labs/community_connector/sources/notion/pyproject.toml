[project]
name = "databricks-labs-community-connector-notion"
version = "0.1.0"
description = "Notion source connector for Lakeflow Community Connectors"
dependencies = [
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pyyaml>=6.0,<7.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"