# mailchimp Community Connector Spec
# This file defines the specification for the connector including
# connection parameters and allowlist options.

# ============================================================================
# Connection Parameters
# These are provided when creating the Unity Catalog connection.
# ============================================================================
display_name: Mailchimp
connection:
  parameters:
    - name: api_key
      type: string
      required: true
      secret: true
      description: >
        Mailchimp Marketing API key used for HTTP Basic authentication.
        The account data center is derived from the key's '-<dc>' suffix
        (e.g. '...-us21' -> 'us21') to build the API base URL.
    - name: server_prefix
      type: string
      required: false
      description: >
        Data center / server prefix (e.g. 'us21'). Only needed for legacy keys
        that have no '-<dc>' suffix; otherwise it is derived from api_key.

# ============================================================================
# External Options Allowlist
# These table-specific options must be included in the externalOptionsAllowList
# parameter of the UC connection to allow them to be passed through.
# Use a comma-separated string of option names.
# If no table-specific options are needed, set to empty string or omit.
# ============================================================================
external_options_allowlist: "max_records_per_batch,window_seconds,start_timestamp,lookback_seconds"
