# M5 tenant-isolated pipeline. Use a different connection, pipeline, Job, and
# destination schema for every QuickBooks realm.
connection_name: quickbooks_sandbox
objects:
  - table:
      source_table: customers
      table_configuration: &update_configuration
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
        sequence_by: last_updated_at
        incremental_overlap_seconds: "60"
        max_incremental_window_seconds: "86400"
  - table:
      source_table: vendors
      table_configuration: *update_configuration
  - table:
      source_table: accounts
      table_configuration: *update_configuration
  - table:
      source_table: items
      table_configuration: *update_configuration
  - table:
      source_table: invoices
      table_configuration: &transaction_configuration
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
        sequence_by: last_updated_at
        incremental_overlap_seconds: "60"
        max_incremental_window_seconds: "86400"
        delete_overlap_seconds: "60"
        initial_delete_lookback_seconds: "300"
  - table:
      source_table: bills
      table_configuration: *transaction_configuration
