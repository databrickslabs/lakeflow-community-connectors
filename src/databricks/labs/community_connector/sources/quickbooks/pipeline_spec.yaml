# M2 six-table snapshot pipeline. Destination catalog/schema default to the
# pipeline target and may be overridden per table.
connection_name: quickbooks_sandbox
objects:
  - table:
      source_table: customers
      table_configuration:
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
  - table:
      source_table: vendors
      table_configuration:
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
  - table:
      source_table: accounts
      table_configuration:
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
  - table:
      source_table: items
      table_configuration:
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
  - table:
      source_table: invoices
      table_configuration:
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
  - table:
      source_table: bills
      table_configuration:
        scd_type: SCD_TYPE_1
        primary_keys: [realm_id, id]
