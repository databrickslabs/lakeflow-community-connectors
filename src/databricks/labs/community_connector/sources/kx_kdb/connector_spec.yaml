# KX KDB HDB Lakeflow community connector specification.

display_name: KX KDB HDB
connection:
  parameters:
    - name: hdb_root_path
      type: string
      required: true
      description: >
        FUSE-mounted root path of the KDB HDB dataset, such as
        /Volumes/<catalog>/<schema>/<volume>/kdb_hdb. The root must contain
        the HDB sym file and date partition directories.

    - name: license_volume_path
      type: string
      required: true
      description: >
        Directory path used for `QLIC` and working-directory setup before importing
        PyKX. This must be the containing directory (for example
        /Volumes/<catalog>/<schema>/<volume>/keys/), not the direct kc.lic file path.
        On Databricks, customers must provide a commercial KX license whose terms
        permit third-party-cloud use.

    - name: kdbx_secret_scope
      type: string
      required: false
      description: >
        Databricks secret scope containing the KDB-X installer bearer token and
        base64 license. When this is supplied, also provide both secret key
        options below so the connector can bootstrap KDB-X non-interactively on
        serverless compute before importing PyKX.

    - name: kdbx_install_bearer_secret_key
      type: string
      required: false
      description: >
        Secret key name inside `kdbx_secret_scope` that stores the OAuth bearer
        token used to download `install_kdb.sh`.

    - name: kdbx_license_b64_secret_key
      type: string
      required: false
      description: >
        Secret key name inside `kdbx_secret_scope` that stores the base64
        license string passed to `install_kdb.sh` (`--k4b64lic` for k4.lic,
        `--b64lic` for kc.lic).

    - name: kdbx_install_bearer_token
      type: string
      required: false
      secret: true
      description: >
        Preferred Lakeflow option for the customer's KDB-X installer bearer token.
        Define it in SQL with `secret('<scope>', '<key>')` so the connector receives
        the resolved value directly from the Unity Catalog connection options.

    - name: kdbx_license_b64
      type: string
      required: false
      secret: true
      description: >
        Preferred Lakeflow option for the customer's base64 commercial KX license.
        Define it in SQL with `secret('<scope>', '<key>')` so the connector receives
        the resolved value directly from the Unity Catalog connection options.

    - name: kdbx_license_file_path
      type: string
      required: false
      description: >
        Optional FUSE path to the customer's commercial KX license file or license
        directory, in the same Unity Catalog Volume as license_volume_path. The
        connector reads the license at runtime and uses it for KDB-X bootstrap
        without storing the base64 license in the pipeline spec.
        A file named k4.lic is treated as a commercial k4 license.

    - name: kdbx_license_kind
      type: string
      required: false
      description: >
        License file type for KDB-X bootstrap: `k4` for a commercial k4.lic license
        or `kc` for a kc.lic license. Defaults to the file name found through
        `kdbx_license_file_path`, otherwise `kc`. Set `k4` when supplying a
        commercial license through `kdbx_license_b64` or secrets.

    - name: kdbx_offline_bundle_path
      type: string
      required: false
      description: >
        Optional path to a pre-built KDB-X air-gapped bundle, in the same Unity
        Catalog Volume as license_volume_path. Use
        l64arm-bundle.zip for ARM64 runtimes (including current Lakeflow
        serverless) and l64-bundle.zip for x86_64. When set or when a matching
        bundle is found near <license_volume_path>, the connector installs
        KDB-X via `install_kdb.sh --offline` and skips the bearer-token
        download entirely.

    - name: kdbx_install_mode
      type: string
      required: false
      description: >
        KDB-X bootstrap mode: `auto` (default), `offline`, or `online`. Use
        `online` to force downloading `install_kdb.sh` with the bearer token even
        when an offline bundle is configured.

    - name: discovery_sample_dates
      type: integer
      required: false
      description: >
        Optional limit for table discovery. Set to 0 or omit to scan all date
        partitions when listing tables.

external_options_allowlist: "start_date,end_date,ingestion_mode,partition_strategy,sym_column"
