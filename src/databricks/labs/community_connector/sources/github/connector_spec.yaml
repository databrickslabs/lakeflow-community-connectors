# github Community Connector Spec
# This file defines the specification for the connector including
# connection parameters and allowlist options.

# ============================================================================
# Connection Parameters
# These are provided when creating the Unity Catalog connection.
# ============================================================================
display_name: GitHub
connection:
  parameters:
    - name: token
      type: string
      required: true
      secret: true
      description: >
        GitHub Personal Access Token used for REST API authentication. This
        connector only issues read (GET) calls, so use a fine-grained PAT
        scoped to just the repositories you want to ingest, with read-only
        permissions: Metadata: Read (mandatory) and Contents: Read (covers
        repository_files, commits, branches). Add Issues: Read and Pull
        requests: Read only if you also ingest those metadata tables. Do not
        grant any write permission. Avoid the classic 'repo' scope, which
        grants full read+write control of private repositories.

    - name: base_url
      type: string
      required: false
      description: >
        Base URL for the GitHub API. Override for GitHub Enterprise Server
        instances. Defaults to https://api.github.com if not specified.

# ============================================================================
# External Options Allowlist
# These table-specific options must be included in the externalOptionsAllowList
# parameter of the UC connection to allow them to be passed through.
# Use a comma-separated string of option names.
# If no table-specific options are needed, set to empty string or omit.
# ============================================================================
external_options_allowlist: "owner,repo,state,per_page,lookback_seconds,start_date,org,pull_number,max_records_per_batch,window_seconds,ref,include_extensions,include_globs,exclude_globs,max_file_bytes,include_binary"
