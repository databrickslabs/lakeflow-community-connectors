# Maxio / SaaSOptics REST API v1.0 Community Connector Spec
# This file defines the specification for the connector including
# connection parameters and allowlist options.

# ============================================================================
# Connection Parameters
# These are provided when creating the Unity Catalog connection.
# ============================================================================
display_name: Maxio
connection:
  parameters:
    - name: server_subdomain
      type: string
      required: true
      description: >
        SaaSOptics instance subdomain (the portion before ".saasoptics.com").
        Example: "acme" for instance https://acme.saasoptics.com/.

    - name: account_name
      type: string
      required: true
      description: >
        SaaSOptics account/instance path segment. Example: "example_co"
        for base URL https://acme.saasoptics.com/example_co/api/v1.0/.

    - name: api_key
      type: string
      required: true
      secret: true
      description: >
        SaaSOptics API token for authentication. Created in the SaaSOptics UI
        via Admin > API Tokens. Format: arbitrary alphanumeric string.
        Used in Authorization header as "Token <api_key>" (not Bearer).

# ============================================================================
# External Options Allowlist
# These table-specific options must be included in the externalOptionsAllowList
# parameter of the UC connection to allow them to be passed through.
# Use a comma-separated string of option names.
# If no table-specific options are needed, set to empty string or omit.
# ============================================================================
external_options_allowlist: "max_records_per_batch"
