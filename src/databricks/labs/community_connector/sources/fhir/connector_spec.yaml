# FHIR R4 Community Connector Spec
# This file defines the specification for the FHIR connector including
# connection parameters and allowlist options.

# ============================================================================
# Connection Parameters
# These are provided when creating the Unity Catalog connection.
# ============================================================================
display_name: FHIR R4
connection:
  # ---------------------------------------------------------------------------
  # Multiple Authentication Methods
  # The FHIR connector supports 3 authentication methods for different FHIR servers:
  # 1. jwt_assertion - SMART Backend Services with RSA private key (Epic, Cerner)
  # 2. client_secret - OAuth2 client credentials with symmetric secret (SMART v1)
  # 3. none - No authentication (open/dev servers like HAPI FHIR public)
  # ---------------------------------------------------------------------------
  auth_methods:
    - name: jwt_assertion
      description: >
        SMART Backend Services authentication using an asymmetric private key (RSA or EC).
        Implements the JWT assertion flow per the SMART on FHIR Backend Services specification.
        Supported algorithms: RS384 (default), ES384.
        Use this for production FHIR servers that support SMART Backend Services
        (e.g., Epic, Cerner). The connector will obtain a short-lived access token
        using the JWT assertion flow.
      parameters:
        - name: token_url
          type: string
          required: false
          description: >
            OAuth2 token endpoint URL. If omitted, the connector will attempt to
            auto-discover it by fetching {base_url}/.well-known/smart-configuration
            per the SMART on FHIR Backend Services specification.
            Provide explicitly if the server does not publish a SMART configuration
            document, or to override auto-discovery.
            Example: https://ehr.example.com/oauth/token

        - name: client_id
          type: string
          required: true
          description: >
            OAuth2 client ID registered with the FHIR server for Backend Services.

        - name: private_key_pem
          type: string
          required: true
          description: >
            RSA private key in PEM format (multiline). This key must be registered
            with the FHIR server. Include the key delimiters (BEGIN PRIVATE KEY
            and END PRIVATE KEY).

        - name: kid
          type: string
          required: true
          description: >
            The identifier of the key-pair used to sign the JWT assertion. This
            identifier SHALL be unique within the client's JWK Set and must match
            the key registered with the FHIR server. Required by the SMART on FHIR
            Backend Services specification.

        - name: private_key_algorithm
          type: string
          required: false
          description: >
            JWT signing algorithm. Defaults to "RS384".
            Per the SMART on FHIR Backend Services spec, clients SHALL support RS384 and ES384.
            Accepted values: "RS384" (RSA with SHA-384), "ES384" (ECDSA with SHA-384).
            Additional algorithms (e.g. RS256) are permitted by the spec via MAY but are
            not recommended for production use with spec-compliant servers.
            Example: RS384

        - name: scope
          type: string
          required: true
          description: >
            OAuth2 scope(s) for the access token. FHIR servers typically use scopes
            like system/*.read or system/Patient.read for Backend Services.
            Use space-separated scopes if multiple are needed.
            Example: system/Patient.read system/Observation.read

    - name: client_secret
      description: >
        OAuth2 client credentials flow using a symmetric secret.
        Use this for SMART v1 confidential clients or other OAuth2-compliant servers.
        The connector will exchange client credentials for an access token.
      parameters:
        - name: token_url
          type: string
          required: false
          description: >
            OAuth2 token endpoint URL. If omitted, the connector will attempt to
            auto-discover it by fetching {base_url}/.well-known/smart-configuration
            per the SMART on FHIR Backend Services specification.
            Provide explicitly if the server does not publish a SMART configuration
            document, or to override auto-discovery.
            Example: https://ehr.example.com/oauth/token

        - name: client_id
          type: string
          required: true
          description: >
            OAuth2 client ID registered with the FHIR server.

        - name: client_secret
          type: string
          required: true
          description: >
            OAuth2 client secret associated with the client_id.
            Keep this secure and never commit to version control.

        - name: scope
          type: string
          required: false
          description: >
            OAuth2 scope(s) for the access token (optional for client credentials flow).
            Example: system/Patient.read system/Observation.read

    - name: none
      description: >
        No authentication. Use this for public or development FHIR servers
        (e.g., HAPI FHIR public test server, open EHR sandboxes).
        All parameters are optional for this method.
      parameters: []

  # Shared parameters (apply to all authentication methods)
  parameters:
    - name: base_url
      type: string
      required: true
      description: >
        Base URL of the FHIR R4 server. This is the root endpoint used to construct
        all FHIR API requests (e.g., /Patient, /Observation, etc.).
        Examples:
          - https://ehr.example.com/fhir/r4
          - https://hapi.fhir.org/baseR4
          - http://localhost:8080/fhir

    - name: auth_type
      type: string
      required: true
      description: >
        Authentication method to use. Must be one of: "jwt_assertion", "client_secret", or "none".
        Select the auth_type that matches your FHIR server's capabilities.

    - name: resource_types
      type: string
      required: false
      description: >
        Comma-separated FHIR resource types to ingest; each becomes its own table.
        Every table has the same schema (resource_type, resource_id, last_updated,
        resource VARIANT, fhir_version, ingested_at), so any R4 resource type works
        without schema code. Default: Patient, Observation, Condition, Encounter,
        Procedure, MedicationRequest, DiagnosticReport, AllergyIntolerance,
        Immunization, Coverage, CarePlan, Goal, Device, DocumentReference.

    # ── Bulk Data Export options (opt-in) ──────────────────────────────────────
    - name: bulk_export_enabled
      type: string
      required: false
      description: >
        Enable FHIR Bulk Data Access export mode (HL7 Bulk Data Access IG).
        When "true", the connector uses the async $export workflow instead of
        per-resource bundle pagination. Default: "false".

    - name: bulk_export_scope
      type: string
      required: false
      description: >
        Export scope for bulk requests. "system": all resources server-wide.
        "patient": Patient compartment export. "group": Group-specific export
        (requires bulk_export_group_id). Default: "system".

    - name: bulk_export_group_id
      type: string
      required: false
      description: >
        FHIR Group resource ID for group-scoped bulk export. Required when
        bulk_export_scope is "group". Ignored otherwise. This ID is provided
        by the healthcare organization's administrators.

    - name: bulk_export_poll_interval
      type: string
      required: false
      description: >
        Seconds between status poll requests while waiting for bulk export
        to complete. The server's Retry-After header takes precedence when
        present. Default: "30".

    - name: bulk_export_timeout
      type: string
      required: false
      description: >
        Maximum seconds to wait for a bulk export job to complete before
        raising an error. Default: "14400" (4 hours).

    - name: bulk_incremental_mode
      type: string
      required: false
      description: >
        How to apply the CDC cursor in bulk export mode. "since": standard
        _since parameter (most servers). "typefilter": _typeFilter with date
        ranges, sent alongside _type (Epic workaround — Epic does not support
        _since). "full": no incremental filtering — re-exports ALL data on
        every trigger and ingests it as a snapshot, so resources deleted on the
        server are removed from the target; use a low trigger frequency.
        Default: "since".

    - name: bulk_overlap_seconds
      type: string
      required: false
      description: >
        Seconds to rewind the cursor after each bulk export. Servers differ on
        whether the manifest's transactionTime marks the start or the completion
        of an export; on completion-time servers a 0 overlap can skip resources
        written while the export ran. A non-zero value re-reads that window —
        duplicates are absorbed by the upsert on the primary key. The cursor is
        never moved earlier than the previous cursor. Default: "0".

    - name: bulk_export_ignore_errors
      type: string
      required: false
      description: >
        "true" to accept a bulk export whose manifest reports error or fatal
        OperationOutcomes. By default such an export fails the read without
        advancing the cursor, so the next trigger retries instead of silently
        skipping the resources that failed to export. Warning and information
        outcomes are always just logged. Default: "false".

# ============================================================================
# External Options Allowlist
# These table-specific options must be included in the externalOptionsAllowList
# parameter of the UC connection to allow them to be passed through.
# ============================================================================
external_options_allowlist: "resource_types,page_size,max_records_per_batch,page_delay,bulk_export_enabled,bulk_export_scope,bulk_export_group_id,bulk_export_poll_interval,bulk_export_timeout,bulk_incremental_mode,bulk_overlap_seconds,bulk_export_ignore_errors"
