# Visma e-conomic OpenAPI family (https://apis.e-conomic.com/).
#
# Each domain is a separate "resource API" with its own version segment:
#   /projectsapi/v1.1.0/{Employees,Projects,TimeEntries}
#   /customersapi/v3.1.0/Customers
# The version segment is a placeholder so connector-side version overrides
# (projects_api_version / customers_api_version options) still match.
#
# Connector flow:
#   * read_table(employees)            -> GET /projectsapi/{v}/Employees      (snapshot)
#   * read_table(customers)            -> GET /customersapi/{v}/Customers     (snapshot)
#   * read_table(projects)             -> GET /projectsapi/{v}/Projects       (cdc, lastUpdated)
#   * read_table(project_time_entries) -> GET /projectsapi/{v}/TimeEntries    (cdc, lastUpdated)
#
# Query params the connector sends:
#   filter  e-conomic filter syntax, e.g.
#           lastUpdated$gte:2024-01-01T00:00:00$and:number$gt:42
#           (cdc tables only; snapshot reads send no filter)
#   cursor  opaque continuation token taken from the previous response
#
# Response envelope: {"items": [...], "cursor": "<next>"}; ``cursor`` is
# omitted on the last page. Neither the composite ``filter`` expression nor
# the body-cursor pagination maps onto the declarative param-role pipeline,
# so every endpoint is served by ``handlers/cursor_list.py`` (filter
# evaluation + cursor paging over the corpus, small page size so the
# connector's cursor loop is exercised).
#
# Live-validated 2026-11-02 against the public "demo" agreement:
#   * envelope is {"items": [...]} with no ``cursor`` key on the last page
#     (demo tables are 5-10 rows, so a second page never occurs live;
#     cursor paging is exercised only by the simulator's 20-item pages)
#   * ``lastUpdated$gte:YYYY-MM-DDTHH:MM:SS`` and the combined
#     ``...$and:number$gt:N`` form both return 200 with correctly filtered
#     rows; an unmatched bound returns {"items": []}
#   * timestamps are naive whole-minute values (no zone, no fraction); they
#     appear to be Danish local time (a time entry whose text says
#     "23:13:32 +01:00" has lastUpdated 23:14:00), not UTC
#   * projects.lastUpdated was non-null on every demo row
# The corpus is the live demo rows (re-seeded from the cassette via
# tools.cassette_to_corpus) followed by 15 synthetic rows per table, re-keyed
# from 1000 up, so every schema column and cursor paging stay covered.
#
# Termination: the connector caps its committed lastUpdated cursor at an
# init-time snapshot and stamps completed scans with ``synced_at``.
# ``synthesize_future_records`` adds post-now lastUpdated clones on the two
# cdc endpoints so the init-time cap is exercised.

endpoints:
  - path: "/projectsapi/{version}/Employees"
    method: GET
    corpus: employees
    handler: databricks.labs.community_connector.source_simulator.specs.economic.handlers.cursor_list:serve_cursor_list
    params:
      filter: {role: ignore}
      cursor: {role: ignore}

  - path: "/customersapi/{version}/Customers"
    method: GET
    corpus: customers
    handler: databricks.labs.community_connector.source_simulator.specs.economic.handlers.cursor_list:serve_cursor_list
    params:
      filter: {role: ignore}
      cursor: {role: ignore}

  - path: "/projectsapi/{version}/Projects"
    method: GET
    corpus: projects
    handler: databricks.labs.community_connector.source_simulator.specs.economic.handlers.cursor_list:serve_cursor_list
    params:
      filter: {role: ignore}
      cursor: {role: ignore}
    synthesize_future_records:
      cursor_field: lastUpdated
      count: 3

  - path: "/projectsapi/{version}/TimeEntries"
    method: GET
    corpus: project_time_entries
    handler: databricks.labs.community_connector.source_simulator.specs.economic.handlers.cursor_list:serve_cursor_list
    params:
      filter: {role: ignore}
      cursor: {role: ignore}
    synthesize_future_records:
      cursor_field: lastUpdated
      count: 3
