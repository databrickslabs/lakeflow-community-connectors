# Synthetic fixtures. Live response-shape reports accompany the connector tests.
# Custom handler models JSON:API pagination metadata and opaque incident cursors.
endpoints:
  - path: /v1/incidents
    method: GET
    corpus: incidents
    handler: databricks.labs.community_connector.source_simulator.specs.rootly.handlers:list_resources
    strict_params: true
    validation_cursor:
      request_param: "page[after]"
      response_path: meta.next_cursor
    response:
      pagination_style: page_number
      wrapper:
        records_key: data
    params:
      "page[number]":
        role: page
      "page[size]":
        role: per_page
        default: 100
        max: 100
      "page[after]":
        role: ignore
