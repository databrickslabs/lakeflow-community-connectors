# QuickBooks Online Accounting API query endpoint.
# Query pagination is embedded in the SQL-like `query` parameter, so a custom
# handler parses SELECT/STARTPOSITION/MAXRESULTS and serves the matching corpus.

endpoints:
  - path: "/v3/company/{realm_id}/query"
    method: GET
    handler: databricks.labs.community_connector.source_simulator.specs.quickbooks.handlers.query:serve_query
  - path: "/v3/company/{realm_id}/cdc"
    method: GET
    handler: databricks.labs.community_connector.source_simulator.specs.quickbooks.handlers.cdc:serve_cdc
